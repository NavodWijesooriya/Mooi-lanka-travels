services:
  nextjs-app:
    build:
      context: . # Build using your Dockerfile
      args:
        # Add any build arguments you might need
        NODE_ENV: production
        # Add an argument to indicate that media directory may not exist yet
        CREATE_MEDIA_DIR: "true"
    image: ghcr.io/navodwijesooriya/mooi-lanka-travels-v5 # Updated image name
    container_name: mooi-travels # Updated container name
    ports:
      - "4000:3000" # Ensure port mapping is correct
    volumes:
      - ./uploads:/app/uploads
      - ./data/database:/app/data/database # Map SQLite database directory
      - ./public:/app/public
      - ./media:/app/media
      # Remove next_cache if .next is ignored
      # - next_cache:/app/.next/cache
    environment:
      - PAYLOAD_CONFIG_PATH=/app/src/payload.config.ts
      - NODE_ENV=production
      # Using external secrets rather than hardcoding them here
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - DATABASE_URL=file:/app/data/database/travel-agency-main.db # Keep this
      - PORT=4000
      # Using external secrets rather than hardcoding them here
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=http://nextjs-app:4000 # Updated to bind to all interfaces
      - NEXT_PUBLIC_PAYLOAD_URL=/
      - NEXT_PUBLIC_SERVER_URL=http://0.0.0.0:4000 # Updated for consistency
      - NEXT_PUBLIC_API_URL=http://nextjs-app:4000
      - PAYLOAD_PUBLIC_SERVER_URL=http://localhost:4000
      - NEXT_PUBLIC_SITE_URL=http://localhost:4000
      - HOST=0.0.0.0
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://0.0.0.0:3000" ] # Updated to internal port
      interval: 30s
      timeout: 10s
      retries: 3
    command: [ "npm", "run", "start" ] # Explicitly start the application

volumes:
  # Remove next_cache if .next is ignored
  # next_cache: # Persistent volume for Next.js cache
  payload_data: # Kept for compatibility
